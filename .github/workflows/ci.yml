name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run migrations (creates SQLite schema + vec_chunks)
        run: alembic upgrade head

      - name: Run tests
        run: pytest

      # TODO(Phase 4): once golden_set.json has questions and a baseline recall@5
      # is committed, seed the corpus and assert the threshold here — the "assert a
      # real number, not just that it built" gate:
      #   - name: Seed corpus
      #     run: python scripts/seed_corpus.py
      #   - name: Assert retrieval recall
      #     run: pytest tests/test_retrieval_recall.py
